[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "AtlasIO"
version = "0.2.2"
description = "Read Atlas files (ensembles of redistricting maps), format versions 1 and 2, and convert between them"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
atlasio = "atlasio.__main__:main"

[project.optional-dependencies]
fast = ["orjson"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/jonmjonm/AtlasIO.jl"
Format = "https://github.com/jonmjonm/AtlasIO.jl/blob/main/atlas_format.md"

[tool.setuptools.packages.find]
where = ["src"]
