name: Publish Python package

# Publishes the atlasio package (python/) to PyPI with Trusted Publishing: PyPI trusts this workflow, in this
# repository and the named environment, so no password or API token is stored anywhere. See RELEASING.md.
#
#   * Pushing a release tag (v0.2.4, ...) builds, tests and publishes that version to PyPI.
#   * Run it by hand (Actions -> Publish Python package -> Run workflow) to publish to TestPyPI, a sandbox, as a
#     dry run before tagging. Choosing "pypi" by hand only works when run on a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (pypi only when run on a tag)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check the tag, the Python version and the Julia version agree
        run: |
          py=$(python -c "import re; print(re.search(r'^__version__ = \"([^\"]+)\"', open('python/src/atlasio/__init__.py').read(), re.M).group(1))")
          jl=$(sed -n 's/^version = "\(.*\)"/\1/p' Project.toml)
          echo "atlasio $py, AtlasIO.jl $jl, ref $GITHUB_REF_NAME"
          [ "$py" = "$jl" ] || { echo "::error::atlasio.__version__ ($py) differs from Project.toml ($jl)"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "$GITHUB_REF_NAME" = "v$py" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$py"; exit 1; }
          fi

      - name: Build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build python --outdir dist
          python -m twine check --strict dist/*

      - name: Test the built wheel
        run: |
          python -m pip install pytest numpy dist/*.whl
          python -m pytest python/tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/atlasio
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/atlasio
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
