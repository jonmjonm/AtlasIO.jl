name: Test CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  julia-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ['1.11', '1']

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache Julia deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/environments
            ~/.julia/packages
          key: ${{ runner.os }}-julia-${{ matrix.julia-version }}-${{ hashFiles('Project.toml', 'Manifest.toml') }}

      - name: Install dependencies
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'

      - name: Run tests
        env:
          JULIA_NUM_THREADS: 2   # so eachMap/nextMaps parse in parallel
        run: julia --project=. -e 'import Pkg; Pkg.test()'

  # Test F: files written by this AtlasIO must stay readable by AtlasIO 0.1.5, which downstream
  # packages keep using until they raise their compat bound. See test/compat/.
  compat-0-1-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read files written by this version with AtlasIO 0.1.5
        run: bash test/compat/run_compat_0_1_5.sh

      - name: Old readers (AtlasIO 0.1.5 and 0.2.0) fail safely on v2 files
        run: bash test/compat/run_v2_old_readers.sh

  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            extras: ''
          - python-version: '3.12'
            extras: ''
          - python-version: '3.13'
            extras: 'orjson'      # atlasio's optional faster parser

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installing ./python (not in editable mode) also checks that the atlasio package builds and installs.
      - name: Install the atlasio package and the test tools
        run: pip install pytest numpy ./python ${{ matrix.extras }}

      - name: Run tests
        run: python -m pytest PythonReader python/tests -v
